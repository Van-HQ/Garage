# XcodeGen recipe for the Garage Xcode project.
# Garage.xcodeproj is generated from this file (./setup.sh and ./update.sh run
# `xcodegen generate`), so edit this, not the project.
name: Garage
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  GarageCore:
    path: Packages/GarageCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

targets:
  Garage:
    type: application
    platform: iOS
    sources:
      - path: Garage
    configFiles:
      Debug: Config/Garage.xcconfig
      Release: Config/Garage.xcconfig
    dependencies:
      - package: GarageCore
      - package: Supabase
        product: Supabase
    info:
      path: Garage/Info.plist
      properties:
        CFBundleDisplayName: Garage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        SupabaseHost: $(SUPABASE_HOST)
        SupabasePublishableKey: $(SUPABASE_PUBLISHABLE_KEY)
    settings:
      base:
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
